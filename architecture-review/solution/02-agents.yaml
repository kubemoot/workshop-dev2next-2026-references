apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: adl-review-coordinator
  labels:
    kubemoot.ai/crew: adl-review
    kubemoot.ai/role: coordinator
spec:
  type: chat
  description: "Coordinator for the adl-review crew: convenes the reviewer and writes the review."
  discussRole: coordinator
  capabilities: [tool-calling, reasoning]
  discussChannels: [general, review]
  promptRefs: [advisory-prompt, coordinator-decision-logic, synthesis-prompt]
  temperature: "0.1"
  maxTokens: 2048
  deployment:
    replicas: 1
    port: 8080
    env:
      - name: KUBEMOOT_DISCUSS_ANSWER_DIRECTLY
        value: "false"
      - name: QUARKUS_LANGCHAIN4J_OLLAMA_TIMEOUT
        value: "10m"
      - name: KUBEMOOT_DISCUSS_SYNTHESIS_TIMEOUT_SECONDS
        value: "600"
---
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: adl-reviewer
  labels:
    kubemoot.ai/crew: adl-review
    kubemoot.ai/role: tooler
spec:
  type: chat
  description: "Reads an ADL specification through the fetch tool and reports the rules it violates."
  discussRole: tooler
  think: true
  capabilities: [tool-calling, reasoning, http]
  discussChannels: [review]
  triageSummary: "Reviews ADL architecture specifications: fetches the spec from a URL and reports contradictions, undefined names in ASSERTs, and missing DESCRIPTIONs."
  discussKeywords: [adl, review, spec, specification, assert, never, define, component, violates]
  promptRefs: [discussion-protocol, response-style, adl-reviewer-system]
  enabledTools: [fetch]
  # Stage E: the material, once knowledge/ragsource.yaml is applied.
  ragSources:
    - name: adl-material
  temperature: "0.2"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
    env:
      - name: QUARKUS_LANGCHAIN4J_OLLAMA_TIMEOUT
        value: "10m"
