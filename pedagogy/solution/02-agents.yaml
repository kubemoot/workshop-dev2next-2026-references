apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: exam-coordinator
  labels:
    kubemoot.ai/crew: exam-questions
    kubemoot.ai/role: coordinator
spec:
  type: chat
  description: "Coordinator for the exam-questions crew: convenes the writer and the checker and assembles the set."
  discussRole: coordinator
  capabilities: [tool-calling, reasoning]
  discussChannels: [general, exam]
  promptRefs: [advisory-prompt, coordinator-decision-logic, synthesis-prompt]
  temperature: "0.1"
  maxTokens: 3072
  deployment:
    replicas: 1
    port: 8080
    env:
      - name: KUBEMOOT_DISCUSS_ANSWER_DIRECTLY
        value: "false"
      - name: QUARKUS_LANGCHAIN4J_OLLAMA_TIMEOUT
        value: "10m"
      - name: KUBEMOOT_DISCUSS_SYNTHESIS_TIMEOUT_SECONDS
        value: "600"
---
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: question-writer
  labels:
    kubemoot.ai/crew: exam-questions
    kubemoot.ai/role: tooler
spec:
  type: chat
  description: "Drafts multiple-choice questions for a named syllabus week; reads the topic's reference page through the fetch tool."
  discussRole: tooler
  think: false
  capabilities: [tool-calling, http]
  discussChannels: [exam]
  triageSummary: "Writes multiple-choice exam questions for an introductory Kubernetes course, at the level of a named syllabus week."
  discussKeywords: [exam, question, questions, quiz, multiple-choice, week, syllabus, deployments]
  promptRefs: [discussion-protocol, response-style, question-writer-system]
  enabledTools: [fetch]
  # Stage E: the syllabus and notes, once knowledge/ragsource.yaml is applied.
  ragSources:
    - name: course-material
  temperature: "0.4"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
    env:
      - name: QUARKUS_LANGCHAIN4J_OLLAMA_TIMEOUT
        value: "10m"
---
# Stage C: the second specialist. An analyst, not a tooler: it reads
# what the writer published and checks it. Apply this file again after adding it.
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: answer-checker
  labels:
    kubemoot.ai/crew: exam-questions
    kubemoot.ai/role: analyst
spec:
  type: chat
  description: "Checks drafted exam questions for one defensible key at the right level; publishes concern with a correction when not."
  discussRole: analyst
  capabilities: [tool-calling, http]
  discussChannels: [exam]
  triageSummary: "Verifies exam question answer keys against Kubernetes documentation and the syllabus week."
  discussKeywords: [exam, question, questions, key, answer, check, verify]
  promptRefs: [discussion-protocol, response-style, answer-checker-system]
  enabledTools: [fetch]
  ragSources:
    - name: course-material
  temperature: "0.1"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
    env:
      - name: QUARKUS_LANGCHAIN4J_OLLAMA_TIMEOUT
        value: "10m"
